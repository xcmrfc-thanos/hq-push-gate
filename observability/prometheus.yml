# Prometheus U0/U1 抓取配置（docs/08 §7.1.3：U0 = Prometheus + Grafana；U1 = + Alertmanager、告警规则）
# 宿主机端口统一从 23001 起（业务服务 23021~，APISIX metrics 23012）
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hq-gateway
    static_configs: [{ targets: ["host.docker.internal:23021"] }]
  - job_name: quote-push
    static_configs: [{ targets: ["host.docker.internal:23022"] }]
  - job_name: notify
    static_configs: [{ targets: ["host.docker.internal:23023"] }]
  - job_name: ws-gateway
    static_configs: [{ targets: ["host.docker.internal:23024"] }]
  - job_name: outbox-publisher
    static_configs: [{ targets: ["host.docker.internal:23025"] }]
  - job_name: apisix
    static_configs: [{ targets: ["host.docker.internal:23012"] }]
    metrics_path: /apisix/prometheus/metrics
