<!-- v2 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <defs>
<!-- home banner -->
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0C1530"/>
      <stop offset="55%" stop-color="#080E1E"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16233F" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="420" fill="url(#bg) #05080F"/>
  <rect width="1600" height="420" fill="url(#grid) #05080F"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#lineGrad) #22D3EE" opacity="0.85"/>

  <!-- halo rings behind title -->
  <circle cx="800" cy="205" r="150" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.4" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="0 800 205" to="360 800 205" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="205" r="196" fill="none" stroke="#173253" stroke-width="1" opacity="0.28" stroke-dasharray="2 14">
    <animateTransform attributeName="transform" type="rotate" from="0 800 205" to="-360 800 205" dur="26s" repeatCount="indefinite"/>
  </circle>

  <!-- corner brackets -->
  <g stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.45">
    <path d="M 26 26 H 66 M 26 26 V 58"/>
    <path d="M 1574 26 H 1534 M 1574 26 V 58"/>
    <path d="M 26 394 H 66 M 26 394 V 362"/>
    <path d="M 1574 394 H 1534 M 1574 394 V 362"/>
  </g>

  <!-- circuit decorations -->
  <g stroke="#1E3A5F" stroke-width="1.4" fill="none" opacity="0.9">
    <path d="M 60 96 H 150 V 64 H 236"/>
    <path d="M 60 118 H 176 V 150 H 250"/>
    <path d="M 1540 96 H 1450 V 64 H 1364"/>
    <path d="M 1540 118 H 1424 V 150 H 1350"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="236" cy="64" r="3.5" opacity="0.9"/>
    <circle cx="250" cy="150" r="3.5" opacity="0.9"/>
    <circle cx="1364" cy="64" r="3.5" opacity="0.9"/>
    <circle cx="1350" cy="150" r="3.5" opacity="0.9"/>
    <circle cx="60" cy="96" r="3" opacity="0.7"/>
    <circle cx="60" cy="118" r="3" opacity="0.7"/>
    <circle cx="1540" cy="96" r="3" opacity="0.7"/>
    <circle cx="1540" cy="118" r="3" opacity="0.7"/>
  </g>

  <!-- tech stack chips -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="381" y="87" width="80" height="26" rx="13" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text x="421" y="104" fill="#7DD3FC">Go 1.25</text>
    <rect x="477" y="87" width="84" height="26" rx="13" fill="#FBBF24" fill-opacity="0.08" stroke="#FBBF24" stroke-opacity="0.55"/>
    <text x="519" y="104" fill="#FCD34D">Java 17/21</text>
    <rect x="577" y="87" width="110" height="26" rx="13" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-opacity="0.55"/>
    <text x="632" y="104" fill="#FCA5A5">Flink 1.20.5</text>
    <rect x="703" y="87" width="76" height="26" rx="13" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="741" y="104" fill="#C4B5FD">Kafka</text>
    <rect x="795" y="87" width="104" height="26" rx="13" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.55"/>
    <text x="847" y="104" fill="#6EE7B7">ClickHouse</text>
    <rect x="915" y="87" width="76" height="26" rx="13" fill="#FB7185" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.55"/>
    <text x="953" y="104" fill="#FDA4AF">Redis</text>
    <rect x="1007" y="87" width="92" height="26" rx="13" fill="#60A5FA" fill-opacity="0.08" stroke="#60A5FA" stroke-opacity="0.55"/>
    <text x="1053" y="104" fill="#93C5FD">React 19</text>
    <rect x="1115" y="87" width="104" height="26" rx="13" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.55"/>
    <text x="1167" y="104" fill="#93C5FD">Kubernetes</text>
  </g>

  <!-- title -->
  <text x="800" y="212" text-anchor="middle" font-size="92" font-weight="700" letter-spacing="8" fill="url(#titleGrad) #67E8F9" filter="url(#glow)">HQ-PUSH-GATE</text>
  <text x="800" y="252" text-anchor="middle" font-size="24" letter-spacing="22" fill="#EAF2FF">智 析 平 台</text>
  <text x="800" y="280" text-anchor="middle" font-size="15" letter-spacing="5" fill="#8FA3C0">多源行情接入 · 流式计算 · 条件预警 · 秒级实时推送</text>

  <!-- sparkline -->
  <path d="M 0 372 L 80 366 L 160 372 L 240 356 L 320 362 L 400 340 L 480 348 L 560 332 L 640 344 L 720 326 L 800 338 L 880 320 L 960 334 L 1040 318 L 1120 330 L 1200 316 L 1280 326 L 1360 312 L 1440 322 L 1520 308 L 1600 314 L 1600 420 L 0 420 Z" fill="url(#areaGrad) #0B2B3A"/>
  <path d="M 0 372 L 80 366 L 160 372 L 240 356 L 320 362 L 400 340 L 480 348 L 560 332 L 640 344 L 720 326 L 800 338 L 880 320 L 960 334 L 1040 318 L 1120 330 L 1200 316 L 1280 326 L 1360 312 L 1440 322 L 1520 308 L 1600 314" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.75" filter="url(#glowSm)"/>
  <circle cx="1520" cy="308" r="4" fill="#67E8F9" filter="url(#glowSm)"/>

  <!-- candles: left group (uptrend) -->
  <g stroke-width="1.6">
    <line x1="130" y1="340" x2="130" y2="372" stroke="#34D399" opacity="0.75"/><rect x="123" y="350" width="14" height="16" fill="#34D399" opacity="0.75"/>
    <line x1="162" y1="332" x2="162" y2="366" stroke="#F87171" opacity="0.75"/><rect x="155" y="338" width="14" height="20" fill="#0B1226" stroke="#F87171" opacity="0.85"/>
    <line x1="194" y1="344" x2="194" y2="384" stroke="#34D399" opacity="0.75"/><rect x="187" y="356" width="14" height="18" fill="#34D399" opacity="0.75"/>
    <line x1="226" y1="336" x2="226" y2="360" stroke="#F87171" opacity="0.75"/><rect x="219" y="342" width="14" height="12" fill="#0B1226" stroke="#F87171" opacity="0.85"/>
    <line x1="258" y1="322" x2="258" y2="352" stroke="#34D399" opacity="0.75"/><rect x="251" y="326" width="14" height="18" fill="#34D399" opacity="0.75"/>
    <line x1="290" y1="318" x2="290" y2="346" stroke="#34D399" opacity="0.75"/><rect x="283" y="320" width="14" height="16" fill="#34D399" opacity="0.75"/>
    <line x1="322" y1="326" x2="322" y2="358" stroke="#F87171" opacity="0.75"/><rect x="315" y="332" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.85"/>
    <line x1="354" y1="314" x2="354" y2="342" stroke="#34D399" opacity="0.75"/><rect x="347" y="320" width="14" height="14" fill="#34D399" opacity="0.75"/>
    <line x1="386" y1="320" x2="386" y2="350" stroke="#F87171" opacity="0.75"/><rect x="379" y="326" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.85"/>
    <line x1="418" y1="308" x2="418" y2="336" stroke="#34D399" opacity="0.75"/><rect x="411" y="314" width="14" height="14" fill="#34D399" opacity="0.75"/>
    <line x1="450" y1="302" x2="450" y2="326" stroke="#F87171" opacity="0.75"/><rect x="443" y="306" width="14" height="12" fill="#0B1226" stroke="#F87171" opacity="0.85"/>
    <line x1="482" y1="298" x2="482" y2="322" stroke="#34D399" opacity="0.75"/><rect x="475" y="302" width="14" height="14" fill="#34D399" opacity="0.75"/>
    <line x1="514" y1="306" x2="514" y2="334" stroke="#F87171" opacity="0.75"/><rect x="507" y="310" width="14" height="14" fill="#0B1226" stroke="#F87171" opacity="0.85"/>
    <line x1="546" y1="294" x2="546" y2="318" stroke="#34D399" opacity="0.75"/><rect x="539" y="298" width="14" height="12" fill="#34D399" opacity="0.75"/>
  </g>
  <!-- candles: right group -->
  <g stroke-width="1.6">
    <line x1="1054" y1="318" x2="1054" y2="348" stroke="#F87171" opacity="0.7"/><rect x="1047" y="322" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1086" y1="322" x2="1086" y2="356" stroke="#34D399" opacity="0.7"/><rect x="1079" y="330" width="14" height="16" fill="#34D399" opacity="0.7"/>
    <line x1="1118" y1="330" x2="1118" y2="362" stroke="#F87171" opacity="0.7"/><rect x="1111" y="336" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1150" y1="338" x2="1150" y2="370" stroke="#F87171" opacity="0.7"/><rect x="1143" y="344" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1182" y1="336" x2="1182" y2="368" stroke="#34D399" opacity="0.7"/><rect x="1175" y="342" width="14" height="16" fill="#34D399" opacity="0.7"/>
    <line x1="1214" y1="344" x2="1214" y2="378" stroke="#F87171" opacity="0.7"/><rect x="1207" y="350" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1246" y1="340" x2="1246" y2="372" stroke="#34D399" opacity="0.7"/><rect x="1239" y="346" width="14" height="16" fill="#34D399" opacity="0.7"/>
    <line x1="1278" y1="348" x2="1278" y2="382" stroke="#F87171" opacity="0.7"/><rect x="1271" y="354" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1310" y1="352" x2="1310" y2="386" stroke="#34D399" opacity="0.7"/><rect x="1303" y="360" width="14" height="16" fill="#34D399" opacity="0.7"/>
    <line x1="1342" y1="358" x2="1342" y2="390" stroke="#F87171" opacity="0.7"/><rect x="1335" y="364" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1374" y1="354" x2="1374" y2="388" stroke="#34D399" opacity="0.7"/><rect x="1367" y="360" width="14" height="16" fill="#34D399" opacity="0.7"/>
    <line x1="1406" y1="362" x2="1406" y2="394" stroke="#F87171" opacity="0.7"/><rect x="1399" y="368" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
    <line x1="1438" y1="358" x2="1438" y2="390" stroke="#34D399" opacity="0.7"/><rect x="1431" y="364" width="14" height="16" fill="#34D399" opacity="0.7"/>
    <line x1="1470" y1="366" x2="1470" y2="398" stroke="#F87171" opacity="0.7"/><rect x="1463" y="372" width="14" height="16" fill="#0B1226" stroke="#F87171" opacity="0.8"/>
  </g>
</svg>
